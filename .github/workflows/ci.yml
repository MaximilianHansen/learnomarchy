name: ci
on: [push, pull_request]
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y shellcheck
      - run: bash -n learnomarchy install.sh
      - run: shellcheck -s bash learnomarchy install.sh
      - run: python3 -m py_compile sounds/generate
